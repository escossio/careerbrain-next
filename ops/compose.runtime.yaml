name: careerbrain-next
services:
  postgres:
    image: postgres:16.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${CBN_DATABASE}"
      POSTGRES_USER: "${CBN_POSTGRES_ADMIN_USER}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    command: ["postgres", "-c", "listen_addresses=${CBN_DB_LISTEN_ADDRESS}", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - "${CBN_POSTGRES_DATA}:/var/lib/postgresql/data"
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ../../db/bootstrap.sql:/bootstrap.sql:ro
    secrets: [postgres_admin_password, cb_migrator_password, cb_auth_password, cb_api_password, cb_ingest_password, cb_global_worker_password, cb_private_worker_password, cb_privacy_password]
    networks:
      internal: {ipv4_address: "${CBN_DB_INTERNAL_ADDRESS}"}
      vlan: {ipv4_address: "${CBN_DB_VLAN_ADDRESS}"}
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    build: {context: .., dockerfile: ops/Dockerfile.api}
    restart: unless-stopped
    env_file: ["${CBN_API_ENV_FILE}"]
    networks:
      internal: {ipv4_address: "${CBN_API_INTERNAL_ADDRESS}"}
      vlan: {ipv4_address: "${CBN_API_VLAN_ADDRESS}"}
    depends_on: {migrate: {condition: service_completed_successfully}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request; assert urllib.request.urlopen(os.environ[\"CBN_API_HEALTH_URL\"], timeout=3).status == 200'"]
      interval: 15s
      timeout: 5s
      retries: 4
  migrate:
    build: {context: .., dockerfile: ops/Dockerfile.api}
    restart: "no"
    env_file: ["${CBN_MIGRATOR_ENV_FILE}"]
    command: ["python", "-m", "careerbrain.admin", "migrate"]
    networks:
      internal: {ipv4_address: "${CBN_MIGRATOR_INTERNAL_ADDRESS}"}
    depends_on: {postgres: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
networks:
  internal:
    name: "${CBN_INTERNAL_NETWORK}"
    internal: true
    ipam: {config: [{subnet: "${CBN_INTERNAL_SUBNET}"}]}
  vlan: {name: "${CBN_VLAN_NETWORK}", external: true}
secrets:
  postgres_admin_password: {file: "${CBN_SECRETS_DIR}/postgres_admin_password"}
  cb_migrator_password: {file: "${CBN_SECRETS_DIR}/cb_migrator_password"}
  cb_auth_password: {file: "${CBN_SECRETS_DIR}/cb_auth_password"}
  cb_api_password: {file: "${CBN_SECRETS_DIR}/cb_api_password"}
  cb_ingest_password: {file: "${CBN_SECRETS_DIR}/cb_ingest_password"}
  cb_global_worker_password: {file: "${CBN_SECRETS_DIR}/cb_global_worker_password"}
  cb_private_worker_password: {file: "${CBN_SECRETS_DIR}/cb_private_worker_password"}
  cb_privacy_password: {file: "${CBN_SECRETS_DIR}/cb_privacy_password"}
