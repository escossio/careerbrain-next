name: android-debug

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Verify installed Android API 35
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Record artifact digest
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: careerbrain-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-sha256.txt
          retention-days: 1
          if-no-files-found: error
